name: Normalize published release notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Keep each release body limited to its own version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize all published release bodies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          trap 'rm -f "$NOTES"' EXIT
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
          while IFS= read -r TAG; do
            [[ "$TAG" == v* ]] || continue
            VERSION="${TAG#v}"
            awk -v version="$VERSION" '
              index($0, "## [" version "]") == 1 { printing=1; print; next }
              printing && /^## \[/ { exit }
              printing { print }
            ' CHANGELOG.md > "$NOTES"

            if ! grep -Fq "## [$VERSION]" "$NOTES"; then
              echo "No matching CHANGELOG section for $TAG; leaving its release body unchanged."
              continue
            fi

            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "红果 TV $TAG" --notes-file "$NOTES"
            echo "Normalized release notes for $TAG"
          done
