name: Android TV CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hongguotv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and verify signed TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify or repair fixed signing materials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          value() { sed -n "s/^$1=//p" signing-secrets.txt 2>/dev/null | head -n 1; }
          STORE_PASSWORD="$(value ANDROID_KEYSTORE_PASSWORD)"
          KEY_ALIAS="$(value ANDROID_KEY_ALIAS)"
          KEY_PASSWORD="$(value ANDROID_KEY_PASSWORD)"
          VALID=false
          if [[ -s hongguoTV-release.jks && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            if keytool -list -keystore hongguoTV-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              VALID=true
            fi
          fi
          if [[ "$VALID" != "true" ]]; then
            echo "The initial keystore is missing or invalid. Generating the permanent project key."
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="hongguotv-release"
            rm -f hongguoTV-release.jks
            keytool -genkeypair -noprompt -storetype JKS -keystore hongguoTV-release.jks \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=hongguoTV Personal Build, OU=Personal, O=xiaobei206, L=Suzhou, ST=Jiangsu, C=CN" >/dev/null 2>&1
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } > signing-secrets.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hongguoTV-release.jks signing-secrets.txt
            git commit -m "build: initialize permanent TV signing key"
            git push origin HEAD:main
          fi
          keytool -list -keystore hongguoTV-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Fixed signing keystore is valid and ready."

      - name: Run unit tests, lint and build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease

      - name: Verify package metadata and APK signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.xiaobei206.hongguotv' versionCode='1' versionName='1.0.0'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'23'"
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          PASSWORD="$(sed -n 's/^ANDROID_KEYSTORE_PASSWORD=//p' signing-secrets.txt | head -n 1)"
          ALIAS="$(sed -n 's/^ANDROID_KEY_ALIAS=//p' signing-secrets.txt | head -n 1)"
          EXPECTED="$(keytool -exportcert -alias "$ALIAS" -keystore hongguoTV-release.jks -storepass "$PASSWORD" 2>/dev/null | sha256sum | awk '{print toupper($1)}')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p dist
          cp "$APK" dist/hongguoTV-v1.0.0-universal.apk
          cd dist
          sha256sum hongguoTV-v1.0.0-universal.apk > hongguoTV-v1.0.0-SHA256SUMS.txt
          echo "Verified certificate SHA-256: $ACTUAL"
          echo "apk=dist/hongguoTV-v1.0.0-universal.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguoTV-v1.0.0-${{ github.run_number }}
          path: |
            dist/hongguoTV-v1.0.0-universal.apk
            dist/hongguoTV-v1.0.0-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Check whether the 1.0.0 release already exists
        id: release_check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish hongguoTV 1.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: main
          name: 红果 TV v1.0.0
          body_path: CHANGELOG.md
          files: |
            dist/hongguoTV-v1.0.0-universal.apk
            dist/hongguoTV-v1.0.0-SHA256SUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
