name: Android TV CI and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hongguotv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and verify signed TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout openhongguo SDK source
        uses: actions/checkout@v4
        with:
          repository: xiaobei206/openhongguo
          ref: main
          path: .build/openhongguo

      - name: Checkout audited Android diagnostics patch
        uses: actions/checkout@v4
        with:
          repository: xiaobei206/kaixinguo-android
          ref: main
          path: .build/kaixinguo

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Patch, test and build the shared openhongguo Android AAR
        shell: bash
        run: |
          set -euo pipefail
          python3 .build/kaixinguo/scripts/patch-openhongguo.py .build/openhongguo
          cd .build/openhongguo
          go test ./...
          (cd bindings/mobile/core && go test ./...)
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          gomobile init
          cd bindings/mobile
          chmod +x build.sh
          ./build.sh android
          test -s android/build/outputs/aar/openhongguo-release.aar

      - name: Verify or repair fixed signing materials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          value() { sed -n "s/^$1=//p" signing-secrets.txt 2>/dev/null | head -n 1; }
          STORE_PASSWORD="$(value ANDROID_KEYSTORE_PASSWORD)"
          KEY_ALIAS="$(value ANDROID_KEY_ALIAS)"
          KEY_PASSWORD="$(value ANDROID_KEY_PASSWORD)"
          VALID=false
          if [[ -s hongguoTV-release.jks && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            if keytool -list -keystore hongguoTV-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              VALID=true
            fi
          fi
          if [[ "$VALID" != "true" ]]; then
            echo "The initial keystore is missing or invalid. Generating the permanent project key."
            STORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="hongguotv-release"
            rm -f hongguoTV-release.jks
            keytool -genkeypair -noprompt -storetype JKS -keystore hongguoTV-release.jks \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=hongguoTV Personal Build, OU=Personal, O=xiaobei206, L=Suzhou, ST=Jiangsu, C=CN" >/dev/null 2>&1
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } > signing-secrets.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add hongguoTV-release.jks signing-secrets.txt
            git commit -m "build: initialize permanent TV signing key"
            git push origin HEAD:main
          fi
          keytool -list -keystore hongguoTV-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Fixed signing keystore is valid and ready."

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION" && test -n "$CODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests, lint and build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease \
            -PpatchedOpenhongguoAar="$GITHUB_WORKSPACE/.build/openhongguo/bindings/mobile/android/build/outputs/aar/openhongguo-release.aar"

      - name: Print Android Lint diagnostics when present
        if: always()
        shell: bash
        run: |
          REPORT="app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt"
          if [[ -f "$REPORT" ]]; then
            echo "===== Android Lint diagnostics ====="
            sed -n '1,240p' "$REPORT"
          else
            echo "No Android Lint text report was generated."
          fi

      - name: Verify package metadata and APK signature
        id: verify
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.xiaobei206.hongguotv' versionCode='${VERSION_CODE}' versionName='${VERSION}'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'23'"
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          PASSWORD="$(sed -n 's/^ANDROID_KEYSTORE_PASSWORD=//p' signing-secrets.txt | head -n 1)"
          ALIAS="$(sed -n 's/^ANDROID_KEY_ALIAS=//p' signing-secrets.txt | head -n 1)"
          EXPECTED="$(keytool -exportcert -alias "$ALIAS" -keystore hongguoTV-release.jks -storepass "$PASSWORD" 2>/dev/null | sha256sum | awk '{print toupper($1)}')"
          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p dist
          cp "$APK" "dist/hongguoTV-v${VERSION}-universal.apk"
          cd dist
          sha256sum "hongguoTV-v${VERSION}-universal.apk" > "hongguoTV-v${VERSION}-SHA256SUMS.txt"
          echo "Verified certificate SHA-256: $ACTUAL"
          echo "apk=dist/hongguoTV-v${VERSION}-universal.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hongguoTV-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: |
            dist/hongguoTV-v${{ steps.version.outputs.version }}-universal.apk
            dist/hongguoTV-v${{ steps.version.outputs.version }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Check whether this TV version release already exists
        id: release_check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare version-specific release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_check.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { printing=1; print; next }
            printing && /^## \[/ { exit }
            printing { print }
          ' CHANGELOG.md > dist/release-notes.md
          if ! grep -Fq "## [$VERSION]" dist/release-notes.md; then
            echo "Missing CHANGELOG section for $VERSION" >&2
            exit 1
          fi
          test -s dist/release-notes.md

      - name: Publish hongguoTV release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: main
          name: 红果 TV v${{ steps.version.outputs.version }}
          body_path: dist/release-notes.md
          files: |
            dist/hongguoTV-v${{ steps.version.outputs.version }}-universal.apk
            dist/hongguoTV-v${{ steps.version.outputs.version }}-SHA256SUMS.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
